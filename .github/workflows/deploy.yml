name: Deploy

on:
  push:
    branches: [main]

jobs:
  job_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@v3.99.7

      - name: Check Dockerfile file
        run: test -f Dockerfile

      - name: webfactory/ssh-agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_KEY }}

      - name: Trust Host
        run: ssh-keyscan -H ${{secrets.SSH_IP}} >> ~/.ssh/known_hosts

      - name: check env
        run: |
          ssh ${{secrets.SSH_USER}}@${{secrets.SSH_IP}} "
            set -e

            cd /home/ubuntu/devops_05/go_gin_be
            ls -la 
            test -f .env
          "
      - name: check docker compose
        run: |
          ssh ${{secrets.SSH_USER}}@${{secrets.SSH_IP}} "
            set -e

            cd /home/ubuntu/devops_05
            ls -la 
            test -f docker-compose.yml
          "
