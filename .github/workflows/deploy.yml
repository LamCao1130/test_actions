name: Deploy

on:
  push:
    branches: [main]

env:
  SSH_SERVER: ${{secrets.SSH_USER}}@${{secrets.SSH_IP}}
  WORK_DIR: /home/ubuntu/devops_05/go_gin_be
  DOCKER_FILE_DIR: /home/ubuntu/devops_05
  COMPOSE_SERVICE: go_gin_be

jobs:
  job_check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: use common
        uses: ./.github/actions
        with:
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-ip: ${{ secrets.SSH_IP }}

      - name: Check Dockerfile file
        run: test -f Dockerfile

      - name: check env
        run: |
          ssh $SSH_SERVER "
            set -e

            cd $WORK_DIR
            ls -la 
            test -f .env
          "
      - name: check docker compose
        run: |
          ssh $SSH_SERVER "
            set -e

            cd $DOCKER_FILE_DIR
            ls -la 
            test -f docker-compose.yml
          "
  job_build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: use common
        uses: ./.github/actions
        with:
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-ip: ${{ secrets.SSH_IP }}

      - name: Build Image Docker
        run: docker build -t go_gin_be_img .

      - name: Move Image To Server
        run: docker save go_gin_be_img | gzip | ssh $SSH_SERVER "gunzip | docker load"

  job_deploy:
    runs-on: ubuntu-latest
    needs: [job_check, job_build]

    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: Use Common
        uses: ./.github/actions
        with:
          ssh-key: ${{ secrets.SSH_KEY }}
          ssh-ip: ${{ secrets.SSH_IP }}

      - name: Build Image Docker
        run: |
          ssh $SSH_SERVER "
            set -e

            cd $COMPOSE_FILE_DIR

            docker compose up -d --force-recreate $COMPOSE_SERVICE
            
          "
