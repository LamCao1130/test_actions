name: Practise Workflow

on:
  # push
  workflow_dispatch:

jobs:
  job_check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v7.0.1

      - name: check readme file
        id: check
        run: |
          ls -la
          test -f readme.md
          echo "status=success" >> $GITHUB_OUTPUT
      - name: show echo
        run: echo ${{ steps.check.outputs.status}}

